{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1>{{ titulo }}</h1>
<form method="post" novalidate class="form-padrao">
    {{ form.hidden_tag() }}
    <div class="campo">
        {{ form.nome.label }}
        {{ form.nome(size=40) }}
        {% for erro in form.nome.errors %}<span class="erro">{{ erro }}</span>{% endfor %}
    </div>
    {{ form.submit() }}
</form>
<p><a href="{{ url_for('admin.disciplinas_lista') }}">&larr; Voltar para a lista</a></p>
{% endblock %}
